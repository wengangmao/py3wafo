name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install py3wafo with test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"
      - name: Run the test suite against the installed package
        env:
          MPLBACKEND: Agg
        run: python -m pytest -o pythonpath= -q

  oldest-dependencies:
    name: Oldest supported NumPy and SciPy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install minimum versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install "numpy==1.26.*" "scipy==1.15.*" "matplotlib==3.8.*" "pyproj==3.6.*" "pytest>=7"
          python -m pip install --no-deps .
      - name: Run the test suite
        env:
          MPLBACKEND: Agg
        run: python -m pytest -o pythonpath= -q

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
